<svg width="680" height="810" viewBox="0 0 680 810" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Helvetica, Arial, sans-serif">
<title>SIH26122 architecture grouped into four functional zones with tech stack per layer</title>
<rect width="680" height="810" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8a92a0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#b8760f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Zone envelopes -->
<rect x="45" y="40" width="590" height="150" rx="16" fill="#f3f4f1" stroke="#c7cbc2" stroke-width="1"/>
<text x="65" y="62" font-size="18" font-weight="700" fill="#3a3f38">Data ingestion</text>
<text x="65" y="78" font-size="12" fill="#6b7166">Raw field report intake</text>

<rect x="45" y="230" width="590" height="150" rx="16" fill="#eef1f5" stroke="#b9c4d1" stroke-width="1"/>
<text x="65" y="252" font-size="18" font-weight="700" fill="#1c3550">Core processing engine</text>
<text x="65" y="268" font-size="12" fill="#4f6079">Schedule graph, linking, recompute</text>

<rect x="45" y="420" width="590" height="150" rx="16" fill="#f7ece9" stroke="#dbb6ac" stroke-width="1"/>
<text x="65" y="442" font-size="18" font-weight="700" fill="#7a2e22">Institutional memory</text>
<text x="65" y="458" font-size="12" fill="#95564a">Cross-project delay patterns</text>

<rect x="45" y="610" width="590" height="150" rx="16" fill="#e9f2ee" stroke="#a9cabb" stroke-width="1"/>
<text x="65" y="632" font-size="18" font-weight="700" fill="#245c42">Delivery interface</text>
<text x="65" y="648" font-size="12" fill="#4a7d67">API, Gantt, risk heatmap</text>

<!-- connecting arrows between zones -->
<line x1="340" y1="190" x2="340" y2="230" stroke="#8a92a0" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="380" x2="340" y2="420" stroke="#8a92a0" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="570" x2="340" y2="610" stroke="#8a92a0" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="235" y1="322" x2="251" y2="322" stroke="#b8760f" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
<line x1="425" y1="322" x2="441" y2="322" stroke="#b8760f" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

<!-- Layer 1 -->
<rect x="210" y="94" width="260" height="76" rx="8" fill="#ffffff" stroke="#d8dad3" stroke-width="1"/>
<text x="340" y="114" font-size="13" font-weight="700" fill="#1a2330" text-anchor="middle">Data capture</text>
<text x="340" y="134" font-size="11" fill="#5a6472" text-anchor="middle">CSV, free-text, voice</text>
<text x="340" y="152" font-size="10" fill="#5a6472" text-anchor="middle" opacity="0.8" font-family="Consolas, monospace">Python, FastAPI</text>

<!-- Layer 2 -->
<rect x="61" y="284" width="174" height="76" rx="8" fill="#ffffff" stroke="#d8dad3" stroke-width="1"/>
<text x="148" y="304" font-size="12.5" font-weight="700" fill="#1a2330" text-anchor="middle">Schedule graph</text>
<text x="148" y="324" font-size="10.5" fill="#5a6472" text-anchor="middle">Baseline L5/L6 DAG</text>
<text x="148" y="342" font-size="9.5" fill="#5a6472" text-anchor="middle" opacity="0.8" font-family="Consolas, monospace">NetworkX</text>

<!-- Layer 3 -->
<rect x="251" y="284" width="174" height="76" rx="8" fill="#ffffff" stroke="#d8dad3" stroke-width="1"/>
<text x="338" y="304" font-size="12.5" font-weight="700" fill="#1a2330" text-anchor="middle">Linking engine</text>
<text x="338" y="324" font-size="10.5" fill="#5a6472" text-anchor="middle">Fuzzy + semantic</text>
<text x="338" y="342" font-size="9.5" fill="#5a6472" text-anchor="middle" opacity="0.8" font-family="Consolas, monospace">RapidFuzz, sklearn</text>

<!-- Layer 4 -->
<rect x="441" y="284" width="174" height="76" rx="8" fill="#ffffff" stroke="#d8dad3" stroke-width="1"/>
<text x="528" y="304" font-size="12.5" font-weight="700" fill="#1a2330" text-anchor="middle">Recompute engine</text>
<text x="528" y="324" font-size="10.5" fill="#5a6472" text-anchor="middle">CPM rerun + diff</text>
<text x="528" y="342" font-size="9.5" fill="#5a6472" text-anchor="middle" opacity="0.8" font-family="Consolas, monospace">NetworkX, Python</text>

<!-- Layer 5 -->
<rect x="210" y="474" width="260" height="76" rx="8" fill="#ffffff" stroke="#d8dad3" stroke-width="1"/>
<text x="340" y="494" font-size="13" font-weight="700" fill="#1a2330" text-anchor="middle">Institutional memory</text>
<text x="340" y="514" font-size="11" fill="#5a6472" text-anchor="middle">Queryable execution history</text>
<text x="340" y="532" font-size="10" fill="#5a6472" text-anchor="middle" opacity="0.8" font-family="Consolas, monospace">SQLAlchemy, SQLite/Postgres</text>

<!-- Layer 6 -->
<rect x="210" y="664" width="260" height="76" rx="8" fill="#ffffff" stroke="#d8dad3" stroke-width="1"/>
<text x="340" y="684" font-size="13" font-weight="700" fill="#1a2330" text-anchor="middle">API + dashboard</text>
<text x="340" y="704" font-size="11" fill="#5a6472" text-anchor="middle">Gantt, graph, heatmap UI</text>
<text x="340" y="722" font-size="10" fill="#5a6472" text-anchor="middle" opacity="0.8" font-family="Consolas, monospace">FastAPI, React, D3</text>

<!-- legend -->
<rect x="140" y="780" width="10" height="10" rx="2" fill="#8a9280"/>
<text x="156" y="789" font-size="11" fill="#5a6472">Ingestion</text>
<rect x="239" y="780" width="10" height="10" rx="2" fill="#4f6079"/>
<text x="255" y="789" font-size="11" fill="#5a6472">Core engine</text>
<rect x="352" y="780" width="10" height="10" rx="2" fill="#95564a"/>
<text x="368" y="789" font-size="11" fill="#5a6472">Memory zone</text>
<rect x="465" y="780" width="10" height="10" rx="2" fill="#4a7d67"/>
<text x="481" y="789" font-size="11" fill="#5a6472">Interface</text>
</svg>
